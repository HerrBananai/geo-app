<!DOCTYPE html>
<html lang="de" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Geo-Begriffe</title>
  <meta name="description" content="Geographie-Fachbegriffe interaktiv lernen – Karteikarten, Quiz und Zuordnen." />
  <meta name="theme-color" id="metaTheme" content="#f5f5f7" />
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('geo_theme_v1') || 'system';
      document.documentElement.dataset.design = localStorage.getItem('geo_design_v1') || 'apple';
    } catch (e) {
      document.documentElement.dataset.theme = 'system';
      document.documentElement.dataset.design = 'apple';
    }
  </script>
  <!-- iOS / Safari PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Geo-Begriffe" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles-duo.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span></div>

  <header class="app-header">
    <div class="header-inner">
      <div class="title-wrap">
        <h1 id="viewTitle">Heute lernen</h1>
        <p id="viewSubtitle" class="subtitle">Geographie · Fachbegriffe</p>
      </div>
      <div class="duo-stats" aria-label="Streak und XP">
        <span class="duo-pill" title="Tage-Streak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 1.5s.8 2.8-1.6 5.6C10.3 8.9 8 10.2 8 13.6a6.4 6.4 0 0 0 12.8 0c0-2.1-1-3.9-2.1-5.2-.3 1.1-1 2.1-2.1 2.6.5-3.2-1.1-7.4-3.1-9.5z" fill="#ff9600"/></svg><b class="flame-nr" id="streakText">0</b></span>
        <span class="duo-pill" title="Erfahrungspunkte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8 3.5 9l8.5 13.2L20.5 9z" fill="#1cb0f6"/><path d="M12 1.8 3.5 9h17z" fill="#54c7fc"/></svg><b class="gem-nr" id="xpText">0</b></span>
      </div>
      <button class="icon-btn theme-btn" id="themeBtn" aria-label="Darstellung wechseln" title="Darstellung wechseln"><span id="themeIcon"></span></button>
      <div class="progress-pill" id="progressPill" title="Gelernte Begriffe">
        <svg viewBox="0 0 36 36" class="ring" aria-hidden="true">
          <circle cx="18" cy="18" r="15.5" class="ring-bg" />
          <circle cx="18" cy="18" r="15.5" class="ring-fg" id="ringFg" />
        </svg>
        <span id="progressText">0/0</span>
      </div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div class="install-banner" id="installBanner" hidden>
    <div class="install-text">
      <strong>Zum Home-Bildschirm hinzufügen</strong>
      <span>Teilen-Symbol <span class="share-glyph">⎙</span> → „Zum Home-Bildschirm“ für Vollbild &amp; Offline.</span>
    </div>
    <button class="install-close" id="installClose" aria-label="Hinweis schließen">✕</button>
  </div>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <div class="tabbar-inner">
      <button class="tab" data-view="home" aria-label="Heute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        <span>Heute</span>
      </button>
      <button class="tab" data-view="cards" aria-label="Karten">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="13" height="13" rx="3"/><path d="M4 15V6a2 2 0 0 1 2-2h9"/></svg>
        <span>Karten</span>
      </button>
      <button class="tab" data-view="quiz" aria-label="Quiz">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.3 2-2.3 3.3"/><circle cx="12.1" cy="17" r=".4" fill="currentColor"/></svg>
        <span>Quiz</span>
      </button>
      <button class="tab" data-view="match" aria-label="Paare">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>
        <span>Paare</span>
      </button>
      <button class="tab" data-view="list" aria-label="Alle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
        <span>Alle</span>
      </button>
    </div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
